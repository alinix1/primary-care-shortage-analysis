version: 2

models:
  - name: stg_chronic_disease
    description: "Cleaned and pivoted CDC PLACES 2022-2023 chronic disease data by county. Includes multi-morbidity indicators and disease burden categorization."
    columns:
      - name: county_fips
        description: "Unique county identifier"
        tests:
          - not_null

      - name: county_name
        description: "County name"
        tests:
          - not_null

      - name: stateabbr
        description: "State abbreviation"
        tests:
          - not_null

      - name: year
        description: "Year of data collection"

      - name: statedesc
        description: "Full state name"

      - name: disease_count
        description: "Number of chronic disease measures available for this county"

      - name: has_multimorbidity
        description: "TRUE if county has 2+ chronic diseases reported"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: disease_burden_level
        description: "Categorized burden: High, Moderate, Low, or Insufficient Data"
        tests:
          - not_null
          - accepted_values:
              values: ["High", "Moderate", "Low", "Insufficient Data"]

      - name: diabetes_pct
        description: "% adults diagnosed with diabetes (age-adjusted)"

      - name: heart_disease_pct
        description: "% adults with coronary heart disease (age-adjusted)"

      - name: obesity_pct
        description: "% adults with obesity (age-adjusted)"

      - name: hypertension_pct
        description: "% adults with high blood pressure (age-adjusted)"

      - name: stroke_pct
        description: "% adults who have had a stroke (age-adjusted)"

      - name: arthritis_pct
        description: "% adults with arthritis (age-adjusted)"

      - name: cancer_pct
        description: "% adults with cancer (non-skin) or melanoma (age-adjusted)"

      - name: copd_pct
        description: "% adults with chronic obstructive pulmonary disease (age-adjusted)"

      - name: asthma_pct
        description: "% adults with current asthma (age-adjusted)"

      - name: depression_pct
        description: "% adults with depression (age-adjusted)"

      - name: high_cholesterol_pct
        description: "% adults with high cholesterol (ever screened) (age-adjusted)"

      - name: tooth_loss_pct
        description: "% adults aged 65+ who have lost all teeth (age-adjusted)"

      - name: total_population
        description: "Total county population"

  - name: stg_chronic_disease_2021
    description: "Cleaned CDC PLACES 2018-2019 chronic disease data by county (pre-COVID baseline). Use alongside stg_chronic_disease for pre/post COVID trend analysis."
    columns:
      - name: county_fips
        description: "Unique county identifier"
        tests:
          - not_null

      - name: county_name
        description: "County name"
        tests:
          - not_null

      - name: stateabbr
        description: "State abbreviation"
        tests:
          - not_null

      - name: year
        description: "Year of data collection (2018 or 2019)"

      - name: disease_count
        description: "Number of chronic disease measures available for this county"

      - name: has_multimorbidity
        description: "TRUE if county has 2+ chronic diseases reported"
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: disease_burden_level
        description: "Categorized burden: High, Moderate, Low, or Insufficient Data"
        tests:
          - not_null
          - accepted_values:
              values: ["High", "Moderate", "Low", "Insufficient Data"]

      - name: diabetes_pct
        description: "% adults diagnosed with diabetes (age-adjusted)"

      - name: heart_disease_pct
        description: "% adults with coronary heart disease (age-adjusted)"

      - name: obesity_pct
        description: "% adults with obesity (age-adjusted)"

      - name: hypertension_pct
        description: "% adults with high blood pressure (age-adjusted)"

      - name: stroke_pct
        description: "% adults who have had a stroke (age-adjusted)"

      - name: arthritis_pct
        description: "% adults with arthritis (age-adjusted)"

      - name: cancer_pct
        description: "% adults with cancer non-skin or melanoma (age-adjusted)"

      - name: copd_pct
        description: "% adults with COPD (age-adjusted)"

      - name: asthma_pct
        description: "% adults with current asthma (age-adjusted)"

      - name: depression_pct
        description: "% adults with depression (age-adjusted)"

      - name: high_cholesterol_pct
        description: "% adults with high cholesterol ever screened (age-adjusted)"

      - name: tooth_loss_pct
        description: "% adults aged 65+ who have lost all teeth (age-adjusted)"

      - name: total_population
        description: "Total county population"

  - name: stg_hpsa
    description: "Cleaned HRSA HPSA designation data by county. Includes shortage scores, designation status, and poverty indicators."
    columns:
      - name: county_fips
        description: "5-digit county FIPS code"
        tests:
          - not_null

      - name: hpsa_status
        description: "HPSA designation status (e.g. Designated, Withdrawn)"

      - name: hpsa_score
        description: "HPSA score 0-25, higher = greater need"

      - name: hpsa_degree_of_shortage
        description: "Degree of shortage classification"

      - name: hpsa_formal_ratio
        description: "Population to PCP ratio"

      - name: hpsa_shortage
        description: "Number of additional FTE PCPs needed to remove HPSA designation"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
              where: "hpsa_shortage IS NOT NULL"

      - name: rural_status
        description: "Rural, Partially Rural, or Urban"

      - name: pct_poverty
        description: "% of population below 100% poverty line"

      - name: is_hpsa_designated
        description: "TRUE if county has active HPSA designation"
        tests:
          - not_null
  - name: stg_muap
    description: "Cleaned HRSA Medically Underserved Area/Population (MUAP) data by county. Includes IMU scores, provider ratios, and underserved flags."
    columns:
      - name: county_fips
        description: "5-digit county FIPS code"
        tests:
          - not_null

      - name: imu_score
        description: "Index of Medical Underservice score (0-100, <=62 qualifies as underserved)"

      - name: providers_per_1000
        description: "Number of primary care providers per 1,000 population"

      - name: pct_age_65_over
        description: "% of population aged 65 and over"

      - name: pct_poverty
        description: "% of population with incomes at or below 100% federal poverty level"

      - name: designated_population
        description: "Total population in the designated MUA/P area"

      - name: population_type
        description: "Type of population designation (e.g. Geographic, Population Group)"

      - name: is_medically_underserved
        description: "TRUE if IMU score <= 62"
        tests:
          - not_null

  - name: stg_fqhc
    description: "Cleaned HRSA Federally Qualified Health Center (FQHC) site data. Active sites only, with county-level geographic identifiers."
    columns:
      - name: county_fips
        description: "5-digit county FIPS code"
        tests:
          - not_null

      - name: fqhc_name
        description: "Name of the FQHC site"
        tests:
          - not_null

      - name: city
        description: "City where the FQHC site is located"

      - name: state_abbr
        description: "State abbreviation"
        tests:
          - not_null

      - name: county_name
        description: "County name"

      - name: site_status
        description: "Site status (always 'Active' due to source filter)"
        tests:
          - not_null
          - accepted_values:
              values: ["Active"]
  - name: stg_demographics
    description: "Cleaned county-level demographic data."
    columns:
      - name: county_fips
        description: "5-digit county FIPS code"
        tests:
          - not_null
          - unique

  - name: stg_hospitalizations
    description: "Cleaned county-level hospitalization data."
    columns:
      - name: county_fips
        description: "5-digit county FIPS code"
        tests:
          - not_null
          - unique

  - name: stg_primary_care_access
    description: "Cleaned county-level primary care access data."
    columns:
      - name: county_fips
        description: "5-digit county FIPS code"
        tests:
          - not_null
          - unique

  - name: stg_rural_urban
    description: "Cleaned USDA rural-urban continuum codes by county."
    columns:
      - name: county_fips
        description: "5-digit county FIPS code"
        tests:
          - not_null
          - unique
